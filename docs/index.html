<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PronoLab — Banque de vidéos</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a21; --text:#f2f2f5; --muted:#9a9aa8; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid #26262f; }
  h1 { font-size:20px; margin:0; }
  #quota { color:var(--muted); font-size:14px; }
  .controls { padding:16px 20px; display:flex; gap:10px; flex-wrap:wrap; }
  input, select { background:var(--card); color:var(--text); border:1px solid #2c2c37; border-radius:8px; padding:10px 12px; font-size:15px; }
  input { flex:1; min-width:200px; }
  .grid { padding:0 20px 40px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background:var(--card); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:16/9; background:#26262f; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .body { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .cat { color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .title { font-weight:600; }
  .desc { color:var(--muted); font-size:14px; flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px; font-size:15px; cursor:pointer; }
  button:disabled { background:#3a3a48; cursor:not-allowed; }
  .empty { padding:40px 20px; color:var(--muted); }
  .note { padding:0 20px 20px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>PronoLab — Banque de vidéos</h1>
  <div id="quota">Chargement…</div>
</header>
<div class="controls">
  <input id="search" type="search" placeholder="Rechercher une vidéo…">
  <select id="category"><option value="">Toutes les catégories</option></select>
</div>
<main id="grid" class="grid"></main>
<p class="note">Le compteur de téléchargements est géré dans ton navigateur. Il ne s'applique pas à l'échelle du serveur.</p>

<script>
  const LIMIT = 35;
  const KEY = 'pronolab_downloads';
  let videos = [];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => new Date().toISOString().slice(0, 10);

  function getQuota() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
    const used = d && d.date === today() ? d.count : 0;
    return { used, remaining: Math.max(0, LIMIT - used) };
  }

  function consumeQuota() {
    const q = getQuota();
    if (q.remaining <= 0) return false;
    try { localStorage.setItem(KEY, JSON.stringify({ date: today(), count: q.used + 1 })); } catch {}
    return true;
  }

  function showQuota() {
    const q = getQuota();
    document.getElementById('quota').textContent = `Téléchargements restants aujourd'hui : ${q.remaining} / ${LIMIT}`;
  }

  async function init() {
    videos = await (await fetch('data/videos.json')).json();
    const cats = [...new Set(videos.map(v => v.category))];
    document.getElementById('category').innerHTML =
      '<option value="">Toutes les catégories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
    showQuota();
    render();
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('category').value;
    const left = getQuota().remaining;
    const list = videos.filter(v =>
      (!cat || v.category === cat) &&
      (!q || v.title.toLowerCase().includes(q) || v.description.toLowerCase().includes(q)));
    const grid = document.getElementById('grid');
    if (!list.length) { grid.innerHTML = '<p class="empty">Aucune vidéo trouvée.</p>'; return; }
    grid.innerHTML = list.map(v => `
      <article class="card">
        <div class="thumb">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" style="width:100%;height:100%;object-fit:cover">` : 'Aperçu'}</div>
        <div class="body">
          <div class="cat">${esc(v.category)}</div>
          <div class="title">${esc(v.title)}</div>
          <div class="desc">${esc(v.description)}</div>
          <button ${left <= 0 ? 'disabled' : ''} onclick="download('${esc(v.id)}')">
            ${left <= 0 ? 'Limite atteinte aujourd\'hui' : 'Télécharger'}
          </button>
        </div>
      </article>`).join('');
  }

  function download(id) {
    const v = videos.find(x => x.id === id);
    if (!v) return;
    if (!consumeQuota()) { alert(`Limite de ${LIMIT} téléchargements atteinte pour aujourd'hui`); return; }
    const a = document.createElement('a');
    a.href = `uploads/${encodeURIComponent(v.file)}`;
    a.download = v.file;
    document.body.appendChild(a); a.click(); a.remove();
    showQuota();
    render();
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('category').addEventListener('change', render);
  init();
</script>
</body>
</html>
