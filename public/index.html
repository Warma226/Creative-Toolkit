<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque de vidéos</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a21; --text:#f2f2f5; --muted:#9a9aa8; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid #26262f; }
  h1 { font-size:20px; margin:0; }
  #quota { color:var(--muted); font-size:14px; }
  .controls { padding:16px 20px; display:flex; gap:10px; flex-wrap:wrap; }
  input, select { background:var(--card); color:var(--text); border:1px solid #2c2c37; border-radius:8px; padding:10px 12px; font-size:15px; }
  input { flex:1; min-width:200px; }
  .grid { padding:0 20px 40px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background:var(--card); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:16/9; background:#26262f; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .body { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .cat { color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .title { font-weight:600; }
  .desc { color:var(--muted); font-size:14px; flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px; font-size:15px; cursor:pointer; }
  button:disabled { background:#3a3a48; cursor:not-allowed; }
  .empty { padding:40px 20px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Banque de vidéos</h1>
  <div id="quota">Chargement…</div>
</header>
<div class="controls">
  <input id="search" type="search" placeholder="Rechercher une vidéo…">
  <select id="category"><option value="">Toutes les catégories</option></select>
</div>
<main id="grid" class="grid"></main>

<script>
  let videos = [];
  let quota = { used: 0, remaining: 35 };

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function loadQuota() {
    quota = await (await fetch('/api/quota')).json();
    document.getElementById('quota').textContent =
      `Téléchargements restants aujourd'hui : ${quota.remaining} / 35`;
    render();
  }

  async function init() {
    videos = await (await fetch('/api/videos')).json();
    const cats = [...new Set(videos.map(v => v.category))];
    document.getElementById('category').innerHTML =
      '<option value="">Toutes les catégories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
    await loadQuota();
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('category').value;
    const list = videos.filter(v =>
      (!cat || v.category === cat) &&
      (!q || v.title.toLowerCase().includes(q) || v.description.toLowerCase().includes(q)));
    const grid = document.getElementById('grid');
    if (!list.length) { grid.innerHTML = '<p class="empty">Aucune vidéo trouvée.</p>'; return; }
    grid.innerHTML = list.map(v => `
      <article class="card">
        <div class="thumb">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" style="width:100%;height:100%;object-fit:cover">` : 'Aperçu'}</div>
        <div class="body">
          <div class="cat">${esc(v.category)}</div>
          <div class="title">${esc(v.title)}</div>
          <div class="desc">${esc(v.description)}</div>
          <button ${quota.remaining <= 0 ? 'disabled' : ''} onclick="download('${esc(v.id)}')">
            ${quota.remaining <= 0 ? 'Limite atteinte aujourd\'hui' : 'Télécharger'}
          </button>
        </div>
      </article>`).join('');
  }

  async function download(id) {
    const res = await fetch(`/api/download/${id}`);
    if (res.status === 429) { alert((await res.json()).error); return loadQuota(); }
    if (!res.ok) { alert((await res.json()).error); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = res.headers.get('Content-Disposition')?.match(/filename="(.+)"/)?.[1] || 'video.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    loadQuota();
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('category').addEventListener('change', render);
  init();
</script>
</body>
</html>
